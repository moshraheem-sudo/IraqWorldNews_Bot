name: Test Telegram Bot

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test Message with Browser Headers
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: |
          python3 - << 'EOF'
          import os
          import time
          import requests
          
          token = os.environ.get("TOKEN", "").strip()
          chat_id = os.environ.get("CHAT_ID", "").strip()
          base_url = f"https://api.telegram.org/bot{token}"
          
          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36",
              "Accept": "application/json",
          }
          
          print(f"Testing Bot ID: {token.split(':')[0]} with Chat: {chat_id}", flush=True)
          
          session = requests.Session()
          session.headers.update(headers)
          
          # Test getMe with custom headers
          print("Checking getMe...", flush=True)
          try:
              r = session.get(f"{base_url}/getMe", timeout=15)
              print(f"getMe response: {r.status_code} -> {r.text}", flush=True)
          except Exception as e:
              print(f"getMe exception: {e}", flush=True)

          # Test sendMessage to Channel
          print("Sending test message to channel...", flush=True)
          try:
              r = session.post(
                  f"{base_url}/sendMessage",
                  json={
                      "chat_id": chat_id,
                      "text": "🎉 <b>نبض العراق والعالم الإخباري</b>\n\nتم ربط البوت بالقناة بنجاح! جاهز لنشر الأخبار.",
                      "parse_mode": "HTML"
                  },
                  timeout=15
              )
              print(f"sendMessage response: {r.status_code} -> {r.text}", flush=True)
          except Exception as e:
              print(f"sendMessage exception: {e}", flush=True)
          EOF
