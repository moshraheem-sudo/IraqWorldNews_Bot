name: Test Telegram Bot

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Bot Info and Channel with curl
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "=== 1. Checking getMe with verbose curl ==="
          curl -v -m 60 "https://api.telegram.org/bot${TOKEN}/getMe"
          echo ""

          echo "=== 2. Checking getChat with verbose curl ==="
          curl -v -m 60 "https://api.telegram.org/bot${TOKEN}/getChat?chat_id=${CHAT_ID}"
          echo ""

          echo "=== 3. Sending test message to Channel ==="
          curl -v -m 60 -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\": \"${CHAT_ID}\", \"text\": \"🎉 مبروك! تم تفعيل بوت نبض العراق والعالم بنجاح والاتصال بالقناة مكتمل 100%.\"}"
          echo ""
