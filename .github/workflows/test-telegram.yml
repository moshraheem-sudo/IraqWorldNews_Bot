name: Test Send Message

on:
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Send Test Message
        run: |
          python -c "
          import requests, time
          token = '8922701594:AAGlVJduGsiGp3VU9rKm-M9s9zKF7eUIC3Q'
          chat_id = '6725003936'
          
          # Retry loop with rate limit backoff
          for attempt in range(5):
              r = requests.post(
                  f'https://api.telegram.org/bot{token}/sendMessage',
                  json={'chat_id': chat_id, 'text': '🇮🇶 أهلاً بك! تم ربط البوت بنجاح تام وسيبدأ الآن بنشر أحدث الأخبار تلقائياً.'},
                  timeout=35
              )
              data = r.json()
              print(f'Attempt {attempt+1}: status={r.status_code}, body={data}')
              if data.get('ok'):
                  print('SUCCESS! Message delivered to user.')
                  break
              if data.get('error_code') == 429:
                  wait_time = data.get('parameters', {}).get('retry_after', 25)
                  print(f'Rate limited by Telegram. Waiting {wait_time + 2} seconds...')
                  time.sleep(wait_time + 2)
              else:
                  time.sleep(5)
          "
