name: Test Telegram Bot

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test Message with Full Backoff
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - << 'EOF'
          import os
          import time
          import requests
          
          token = os.environ.get("TOKEN", "").strip()
          chat_id = os.environ.get("CHAT_ID", "").strip()
          base_url = f"https://api.telegram.org/bot{token}"
          
          print(f"Testing Bot ID: {token.split(':')[0]} with Chat: {chat_id}")
          
          def call_api(endpoint, payload=None):
              for attempt in range(1, 4):
                  print(f"[{endpoint}] Attempt {attempt} sending request...")
                  try:
                      if payload:
                          r = requests.post(f"{base_url}/{endpoint}", json=payload, timeout=60)
                      else:
                          r = requests.get(f"{base_url}/{endpoint}", timeout=60)
                      
                      print(f"[{endpoint}] Status: {r.status_code}, Body: {r.text}")
                      data = r.json()
                      if data.get("ok"):
                          return data
                      
                      if data.get("error_code") == 429:
                          wait_time = data.get("parameters", {}).get("retry_after", 32) + 3
                          print(f"[{endpoint}] Rate limited by Telegram! Pausing execution for {wait_time} seconds...")
                          time.sleep(wait_time)
                          continue
                      else:
                          break
                  except Exception as e:
                      print(f"[{endpoint}] Exception on attempt {attempt}: {e}")
                      time.sleep(5)
              return None

          # 1. Check getMe
          me = call_api("getMe")
          print("Bot Details:", me)

          # 2. Send message to Channel
          msg = call_api("sendMessage", {
              "chat_id": chat_id,
              "text": "🎉 <b>نبض العراق والعالم الإخباري</b>\n\nتم ربط البوت بالقناة وتفعيل نظام النشر التلقائي بنجاح!",
              "parse_mode": "HTML"
          })
          print("Send Message Result:", msg)
          EOF
