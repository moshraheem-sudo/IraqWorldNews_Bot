name: Test Telegram Direct

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test Telegram API Directly
        run: |
          python -c "
          import requests
          token = '8922701594:AAGlVJduGsiGp3VU9rKm-M9s9zKF7eUIC3Q'
          chat_id = '6725003936'
          
          print('--- Testing getMe ---')
          try:
              r = requests.get(f'https://api.telegram.org/bot{token}/getMe', timeout=30)
              print('getMe status:', r.status_code)
              print('getMe text:', r.text)
          except Exception as e:
              print('getMe error:', e)
              
          print('--- Testing sendMessage ---')
          try:
              r = requests.post(
                  f'https://api.telegram.org/bot{token}/sendMessage',
                  json={'chat_id': chat_id, 'text': 'تجربة اتصال ناجحة من البوت! 🇮🇶'},
                  timeout=30
              )
              print('sendMessage status:', r.status_code)
              print('sendMessage text:', r.text)
          except Exception as e:
              print('sendMessage error:', e)
          "
