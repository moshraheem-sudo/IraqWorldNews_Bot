name: Test Telegram Bot

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - name: Test from MacOS Runner
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "=== Runner IP Info ==="
          curl -s https://ifconfig.me
          echo ""

          echo "=== 1. Checking getMe from macOS ==="
          curl -s -m 15 "https://api.telegram.org/bot${TOKEN}/getMe"
          echo ""

          echo "=== 2. Sending test message to Channel from macOS ==="
          curl -s -m 15 -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\": \"${CHAT_ID}\", \"text\": \"🎉 <b>نبض العراق والعالم الإخباري</b>\n\nتم الاتصال بنجاح من الخادم! نظام النشر التلقائي يعمل الآن.\"}"
          echo ""
