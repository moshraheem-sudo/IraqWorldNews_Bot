name: Diagnose and Test Telegram

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Run Diagnostics
        run: |
          python3 - << 'EOF'
          import urllib.request
          import json
          import time
          import ssl

          ctx = ssl.create_default_context()

          tokens = [
              ("Token 1 (8922701594)", "8922701594:AAEiFByFJGtRHBOM__oR5c3q5CNiJ4Dfgsc"),
              ("Token 2 (9081516958)", "9081516958:AAE7xLib8f4r0wgMF6NANKoasuTtHC9CJbg"),
          ]

          chat_id = "@WorldNewsIRQ"

          for label, token in tokens:
              print(f"\n==========================================")
              print(f"Testing {label}...")
              print(f"==========================================")
              
              # 1. getMe
              url_me = f"https://api.telegram.org/bot{token}/getMe"
              try:
                  req = urllib.request.Request(url_me, headers={"User-Agent": "NewsBot/1.0", "Connection": "close"})
                  with urllib.request.urlopen(req, timeout=45, context=ctx) as r:
                      resp = json.loads(r.read().decode())
                      bot_user = resp.get("result", {})
                      print(f"[getMe] SUCCESS: username=@{bot_user.get('username')}, id={bot_user.get('id')}, name='{bot_user.get('first_name')}'")
                      bot_id = bot_user.get("id")
              except Exception as e:
                  print(f"[getMe] ERROR: {e}")
                  continue

              time.sleep(2)

              # 2. getChat
              url_chat = f"https://api.telegram.org/bot{token}/getChat?chat_id={chat_id}"
              try:
                  req = urllib.request.Request(url_chat, headers={"User-Agent": "NewsBot/1.0", "Connection": "close"})
                  with urllib.request.urlopen(req, timeout=45, context=ctx) as r:
                      resp = json.loads(r.read().decode())
                      chat_info = resp.get("result", {})
                      print(f"[getChat] SUCCESS: title='{chat_info.get('title')}', type='{chat_info.get('type')}', id={chat_info.get('id')}")
              except Exception as e:
                  print(f"[getChat] ERROR for {chat_id}: {e}")

              time.sleep(2)

              # 3. getChatMember
              url_member = f"https://api.telegram.org/bot{token}/getChatMember?chat_id={chat_id}&user_id={bot_id}"
              try:
                  req = urllib.request.Request(url_member, headers={"User-Agent": "NewsBot/1.0", "Connection": "close"})
                  with urllib.request.urlopen(req, timeout=45, context=ctx) as r:
                      resp = json.loads(r.read().decode())
                      member_info = resp.get("result", {})
                      print(f"[getChatMember] Status: '{member_info.get('status')}', can_post_messages={member_info.get('can_post_messages')}")
              except Exception as e:
                  print(f"[getChatMember] ERROR: {e}")

              time.sleep(2)

              # 4. sendMessage test
              url_send = f"https://api.telegram.org/bot{token}/sendMessage"
              post_data = json.dumps({
                  "chat_id": chat_id,
                  "text": f"✅ <b>تجربة الربط المباشر</b>\n\nتم الاتصال بنجاح من خلال البوت: @{bot_user.get('username')}\nالنظام جاهز لبث الأخبار آلياً.",
                  "parse_mode": "HTML"
              }).encode("utf-8")
              try:
                  req = urllib.request.Request(url_send, data=post_data, headers={"Content-Type": "application/json", "User-Agent": "NewsBot/1.0", "Connection": "close"})
                  with urllib.request.urlopen(req, timeout=45, context=ctx) as r:
                      resp = json.loads(r.read().decode())
                      if resp.get("ok"):
                          print(f"[sendMessage] SUCCESS! Message posted to {chat_id}! msg_id={resp.get('result', {}).get('message_id')}")
                      else:
                          print(f"[sendMessage] FAILED: {resp}")
              except Exception as e:
                  print(f"[sendMessage] ERROR: {e}")

          EOF
